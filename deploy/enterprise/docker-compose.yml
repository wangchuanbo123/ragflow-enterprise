name: ragflow-enterprise

x-app-environment: &app-environment
  APP_PROFILE: enterprise
  APP_ENV: production
  METADATA_STORE_PROVIDER: postgres
  DATABASE_URL: postgresql+psycopg://ragflow:${POSTGRES_PASSWORD}@postgres:5432/ragflow
  VECTOR_STORE_PROVIDER: chroma_http
  CHROMA_HTTP_HOST: chroma
  CHROMA_HTTP_PORT: "8000"
  OBJECT_STORE_PROVIDER: minio
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ragflow
  S3_ADDRESSING_STYLE: path
  TASK_QUEUE_PROVIDER: celery
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CACHE_PROVIDER: redis
  REDIS_URL: redis://redis:6379/2
  GRAPH_STORE_PROVIDER: sqlalchemy
  INDEX_WORKER_ENABLED: "false"
  CONNECTOR_SCHEDULER_ENABLED: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
  ANSWER_LLM_PROVIDER: ${ANSWER_LLM_PROVIDER:-openai_compatible}
  ANSWER_LLM_MODEL: ${ANSWER_LLM_MODEL}
  ANSWER_LLM_BASE_URL: ${ANSWER_LLM_BASE_URL}
  ANSWER_LLM_API_KEY: ${ANSWER_LLM_API_KEY}
  REWRITE_LLM_PROVIDER: ${REWRITE_LLM_PROVIDER:-openai_compatible}
  REWRITE_LLM_MODEL: ${REWRITE_LLM_MODEL:-}
  REWRITE_LLM_BASE_URL: ${REWRITE_LLM_BASE_URL:-}
  REWRITE_LLM_API_KEY: ${REWRITE_LLM_API_KEY:-}
  ROUTER_LLM_PROVIDER: ${ROUTER_LLM_PROVIDER:-openai_compatible}
  ROUTER_LLM_MODEL: ${ROUTER_LLM_MODEL:-}
  ROUTER_LLM_BASE_URL: ${ROUTER_LLM_BASE_URL:-}
  ROUTER_LLM_API_KEY: ${ROUTER_LLM_API_KEY:-}
  GRAPH_EXTRACTION_PROVIDER: ${GRAPH_EXTRACTION_PROVIDER:-current}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragflow
      POSTGRES_USER: ragflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragflow -d ragflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.4.24
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/ragflow
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.enterprise
    image: ragflow-enterprise:${IMAGE_TAG:-local}
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: ragflow-enterprise:${IMAGE_TAG:-local}
    environment: *app-environment
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-Q", "rag.index", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: ragflow-enterprise:${IMAGE_TAG:-local}
    environment: *app-environment
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  minio-data:

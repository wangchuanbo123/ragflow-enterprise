name: ragflow-laptop

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile.enterprise
    image: ragflow-enterprise:${IMAGE_TAG:-laptop}
    env_file:
      - ${RAGFLOW_ENV_FILE:-.env}
    environment:
      APP_PROFILE: local
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/app.db
      METADATA_STORE_PROVIDER: sqlite
      VECTOR_STORE_PROVIDER: chroma_embedded
      OBJECT_STORE_PROVIDER: local
      LOCAL_OBJECT_STORE_DIR: /app/data/docs
      TASK_QUEUE_PROVIDER: inline
      CACHE_PROVIDER: memory
      GRAPH_STORE_PROVIDER: sqlite
      INDEX_WORKER_ENABLED: "true"
      CONNECTOR_SCHEDULER_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ragflow-laptop-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  ragflow-laptop-data:

name: rag-enterprise-integration
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: rag_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_test -d rag_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

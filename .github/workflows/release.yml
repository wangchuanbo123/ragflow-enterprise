name: Test and release production image
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    uses: ./.github/workflows/verify.yml
  image:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: image-disposable-test-password
          POSTGRES_DB: rag_image_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U rag_test -d rag_image_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ['16379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build actual production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rag-enterprise:verified
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check dependencies in production image
        run: docker run --rm rag-enterprise:verified python -m pip check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit installed production Python packages
        run: |
          python -m pip install pip-audit
          docker run --rm rag-enterprise:verified python -m pip freeze > production-requirements.txt
          python -m pip_audit --no-deps --disable-pip -r production-requirements.txt
      - name: Exercise image with disposable PostgreSQL and Redis
        run: |
          docker run --rm --network host \
            -e IMAGE_SMOKE_DISPOSABLE=true -e APP_PROFILE=server -e APP_ROLE=api \
            -e DATABASE_URL=postgresql+psycopg://rag_test:image-disposable-test-password@127.0.0.1:55432/rag_image_test \
            -e METADATA_STORE_PROVIDER=postgresql -e VECTOR_STORE_PROVIDER=pgvector \
            -e GRAPH_STORE_PROVIDER=sqlalchemy -e TASK_QUEUE_PROVIDER=redis -e CACHE_PROVIDER=redis \
            -e REDIS_URL=redis://127.0.0.1:16379/0 -e REDIS_KEY_PREFIX=image-smoke \
            -e JWT_SECRET_KEY=image-test-only-at-least-thirty-two-bytes \
            -e INITIAL_ADMIN_PASSWORD=image-test-password-123 -e INITIAL_ADMIN_USERNAME=image-test \
            -e LLM_PROVIDER=openai_compatible -e LLM_MODEL=image-test \
            -e LLM_API_KEY=unused -e LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e EMBEDDING_PROVIDER=openai_compatible -e EMBEDDING_MODEL=image-test \
            -e EMBEDDING_API_KEY=unused -e EMBEDDING_BASE_URL=http://127.0.0.1:9/v1 \
            -e RERANKER_PROVIDER=none -e CODECODE_AUTO_START=false \
            -e INDEX_WORKER_ENABLED=false -e CONNECTOR_SCHEDULER_ENABLED=false \
            -e GRAPH_COMMUNITY_MAINTENANCE_ENABLED=false -e BACKUP_MONTHLY_ENABLED=false \
            rag-enterprise:verified python -m scripts.smoke_image
      - name: Select commit image name
        if: github.event_name != 'pull_request'
        run: echo "RELEASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        run: |
          docker tag rag-enterprise:verified "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE" | tee image-push.txt
          digest=$(awk '/digest: sha256:/ {for(i=1;i<=NF;i++) if($i=="digest:") print $(i+1)}' image-push.txt | tail -n1)
          test -n "$digest"
          repository=${RELEASE_IMAGE%:sha-*}
          echo "Tested image: $RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned image: $repository@$digest" >> "$GITHUB_STEP_SUMMARY"

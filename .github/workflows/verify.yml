name: Verify team application
on:
  workflow_call:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m scripts.prepare_opencode --install-runtime
      - run: python -m pytest -q --disable-warnings
      - run: python web/tests/contracts/verify_api_contracts.py
      - run: python web/tests/contracts/verify_agent_contracts.py
      - run: python -m scripts.evaluate_routing
        env:
          APP_PROFILE: test
          JWT_SECRET_KEY: ci-only-key-for-public-test-fixtures-32bytes
          INITIAL_ADMIN_PASSWORD: ci-only-password-123
          DATABASE_URL: 'sqlite://'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  server-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: rag_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rag_test -d rag_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://rag_test:isolated-test-password@127.0.0.1:55432/rag_test
      TEST_REDIS_URL: redis://127.0.0.1:16379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints-server.txt -r requirements.txt
      - run: python -m pytest -q tests/test_postgresql_database.py tests/test_pgvector_provider.py tests/test_pgvector_ann.py tests/test_vector_migration.py tests/test_index_integrity_audit.py tests/test_index_rebuild.py tests/test_team_server.py tests/test_distributed_coordination.py tests/test_workflow_process_safety.py tests/test_server_startup.py tests/test_team_load_acceptance.py tests/test_server_backup.py tests/knowledge_graph/test_schema_concurrency.py tests/knowledge_graph/test_schema_consolidation.py tests/test_graph_filters.py tests/test_graph_filters_server.py tests/test_single_graph_boundaries.py --disable-warnings
